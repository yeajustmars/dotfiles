# Configuring hypridle
# See: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

# Note: timeouts are in seconds

general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch dpms on && sleep 2 && kanshictl reload
}

listener {
  timeout = 60
  on-timeout = loginctl lock-session
}

listener {
  timeout = 1200
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on && sleep 2 && kanshictl reload
}
